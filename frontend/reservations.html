<h2>Reservations</h2>

<form id="reservation-form">
  <label>User:
    <select id="reservation_user_id" required></select>
  </label><br>

  <label>Slot:
    <select id="reservation_slot_id">
      <option value="">-- Select slot (optional) --</option>
    </select>
  </label><br>

  <label>Vehicle Number:
    <input type="text" id="reservation_vehicle_number" required />
  </label><br>

  <label>Start Time:
    <input type="datetime-local" id="reservation_start_time" required />
  </label><br>

  <label>End Time:
    <input type="datetime-local" id="reservation_end_time" required />
  </label><br>

  <button type="submit">Add Reservation</button>
</form>

<table border="1" id="reservation-list" style="margin-top: 20px; width: 100%;">
  <thead>
    <tr>
      <th>ID</th>
      <th>User</th>
      <th>Slot</th>
      <th>Vehicle Number</th>
      <th>Start Time</th>
      <th>End Time</th>
      <th>Status</th>
      <th>Payment Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
